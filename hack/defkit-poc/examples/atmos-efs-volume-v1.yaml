apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
    annotations:
        definition.oam.dev/description: Kubevela component to create PV with EFS as the storage
    name: atmos-efs-volume-v1
    namespace: vela-system
spec:
    schematic:
        defkit:
            template: '{"apiVersion":"defkit.oam.dev/v1alpha1","kind":"Component","name":"atmos-efs-volume-v1","params":[{"name":"accessPointId","type":"string"},{"name":"fileSystemId","type":"string"},{"name":"volumeName","type":"string"},{"name":"governance","type":"object","fields":[{"name":"tenantName","type":"string"},{"name":"departmentCode","type":"string"},{"name":"createdBy","type":"string"},{"name":"starSystemName","type":"string"},{"name":"quadrantName","type":"string"}]}],"validators":[{"name":"_validateVolumeName","message":"volumeName must not end with a hyphen","failWhen":{"kind":"matches","param":"volumeName","expr":{"param":"volumeName"},"pattern":".*-$"}},{"name":"_validateTenantName","message":"tenantName must not end with a hyphen","failWhen":{"kind":"matches","param":"governance.tenantName","expr":{"param":"governance.tenantName"},"pattern":".*-$"}},{"name":"_validateDepartmentCode","message":"departmentCode must be a numeric string","failWhen":{"kind":"not","child":{"kind":"matches","param":"governance.departmentCode","expr":{"param":"governance.departmentCode"},"pattern":"^[0-9]+$"}}},{"name":"_validateDepartmentCode0","message":"departmentCode must not start with 0","failWhen":{"kind":"and","children":[{"kind":"matches","param":"governance.departmentCode","expr":{"param":"governance.departmentCode"},"pattern":"^[0-9]+$"},{"kind":"matches","param":"governance.departmentCode","expr":{"param":"governance.departmentCode"},"pattern":"^0"}]}},{"name":"_validateCreatedBy","message":"createdBy must not end with a hyphen","failWhen":{"kind":"matches","param":"governance.createdBy","expr":{"param":"governance.createdBy"},"pattern":".*-$"}},{"name":"_validateStarSystemName","message":"starSystemName must not end with a hyphen","failWhen":{"kind":"matches","param":"governance.starSystemName","expr":{"param":"governance.starSystemName"},"pattern":".*-$"}},{"name":"_validateQuadrantName","message":"quadrantName must not end with a hyphen","failWhen":{"kind":"matches","param":"governance.quadrantName","expr":{"param":"governance.quadrantName"},"pattern":".*-$"}}],"health":{"type":"statusExists"},"status":{"healthyMessage":{"lit":"EFS volume is present"},"unhealthyMessage":{"lit":"EFS volume status missing"}},"template":{"output":{"apiVersion":"v1","kind":"PersistentVolume","fields":[{"path":"metadata.name","value":{"param":"volumeName"}},{"path":"spec.capacity.storage","value":{"lit":"10Gi"}},{"path":"spec.storageClassName","value":{"lit":"efs-csi-infra-sc"}},{"path":"spec.volumeMode","value":{"lit":"Filesystem"}},{"path":"spec.accessModes","value":{"lit":["ReadWriteMany"]}},{"path":"spec.persistentVolumeReclaimPolicy","value":{"lit":"Retain"}},{"path":"spec.csi.driver","value":{"lit":"efs.csi.aws.com"}},{"path":"spec.csi.volumeHandle","value":{"plus":[{"param":"fileSystemId"},{"lit":"::"},{"param":"accessPointId"}]}}]}}}'
    workload:
        definition:
            apiVersion: v1
            kind: PersistentVolume
