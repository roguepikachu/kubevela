# Two components plus traits. One reconcile dispatches several resources
# (Deployment, Service, ConfigMap), so logs from one run interleave.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: shop
  namespace: default
spec:
  components:
    - name: frontend
      type: webservice
      properties:
        image: nginx:1.27-alpine
        ports:
          - port: 80
            expose: true
      traits:
        - type: scaler
          properties:
            replicas: 2
        - type: labels
          properties:
            tier: frontend
    - name: shop-config
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: shop-config
            data:
              currency: EUR
              featureFlags: "checkout-v2"
