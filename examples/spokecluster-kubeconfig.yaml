# SpokeCluster connecting to a k3d, k3s, or kind cluster via a static
# kubeconfig held in a Secret. SpokeCluster is cluster-scoped, so it carries no
# metadata.namespace; the Secret reference sets its namespace explicitly.
apiVersion: v1
kind: Secret
metadata:
  name: dev-spoke-kubeconfig
  namespace: vela-system
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: dev-spoke
        cluster:
          server: https://k3d-dev-spoke-serverlb:6443
          certificate-authority-data: LS0tLS1CRUdJTi...
    users:
      - name: dev-spoke
        user:
          client-certificate-data: LS0tLS1CRUdJTi...
          client-key-data: LS0tLS1CRUdJTi...
    contexts:
      - name: dev-spoke
        context: { cluster: dev-spoke, user: dev-spoke }
    current-context: dev-spoke
---
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: dev-spoke
spec:
  mode: connect
  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        name: dev-spoke-kubeconfig
        namespace: vela-system   # required: SpokeCluster is cluster-scoped
        # key: kubeconfig        # optional, defaults to "kubeconfig"
