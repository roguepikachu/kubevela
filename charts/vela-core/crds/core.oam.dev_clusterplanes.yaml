---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: clusterplanes.core.oam.dev
spec:
  group: core.oam.dev
  names:
    categories:
    - oam
    kind: ClusterPlane
    listKind: ClusterPlaneList
    plural: clusterplanes
    shortNames:
    - cplane
    singular: clusterplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.description
      name: DESCRIPTION
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterPlane is a reusable infrastructure layer referenced by ClusterBlueprints.
          Phase 2 POC shape: no revisions, no status; the hub resolves it by name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterPlaneSpec is a composable infrastructure layer owned
              by one team.
            properties:
              components:
                description: Components are rendered in dependency order.
                items:
                  description: |-
                    ClusterPlaneComponent is one component of a plane. It has the shape of an
                    Application component on purpose: vela-cluster-core lifts it into an
                    Application unchanged, so anything a ComponentDefinition accepts works here.
                  properties:
                    dependsOn:
                      description: |-
                        DependsOn names components of the same plane that must be healthy first.
                        Names are plane-local. The hub's infraProvisioning renderer rewrites each
                        to "<plane>-<name>" to match its prefixed component names; the spoke
                        renderer keeps them as they are.
                      items:
                        type: string
                      type: array
                    name:
                      description: |-
                        Name is unique within the plane and must be a DNS-1123 label. Only the
                        hub's infraProvisioning rendering prefixes it to "<plane>-<component>",
                        which is why each half is capped at 31 characters. On the spoke the
                        component keeps its own name and the plane name becomes the Application
                        name "cluster-<plane>".
                      maxLength: 31
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    properties:
                      description: Properties are the ComponentDefinition parameters.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    traits:
                      description: |-
                        Traits are applied to the component exactly as Application traits are: a
                        platform engineer edits the plane once and every spoke rendered from it picks
                        the trait up on its next revision. Any TraitDefinition on the rendering
                        cluster works.
                      items:
                        description: ApplicationTrait defines the trait of application
                        properties:
                          properties:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          type:
                            type: string
                        required:
                        - type
                        type: object
                      type: array
                    type:
                      description: Type is the ComponentDefinition that renders this
                        component.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - type
                  type: object
                minItems: 1
                type: array
              description:
                description: Description is free text for operators.
                type: string
            required:
            - components
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
