---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: spokeclusters.core.oam.dev
spec:
  group: core.oam.dev
  names:
    kind: SpokeCluster
    listKind: SpokeClusterList
    plural: spokeclusters
    shortNames:
    - sc
    - spokecluster
    singular: spokecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: MODE
      type: string
    - jsonPath: .status.clusterInfo.kubernetesVersion
      name: VERSION
      type: string
    - jsonPath: .status.clusterInfo.nodeCount
      name: NODES
      type: integer
    - jsonPath: .status.clusterInfo.platform
      name: PLATFORM
      type: string
    - jsonPath: .status.connection
      name: STATUS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - jsonPath: .status.clusterInfo.region
      name: REGION
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.apiServerEndpoint
      name: ENDPOINT
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.totalCPU
      name: CPU
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.totalMemory
      name: MEMORY
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.latencyMillis
      name: LATENCY
      priority: 1
      type: integer
    - jsonPath: .spec.credential.type
      name: AUTH
      priority: 1
      type: string
    - jsonPath: .status.lastProbeTime
      name: LAST PROBE
      priority: 1
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          SpokeCluster is the hub-side handle for a managed spoke cluster. In Phase 1 it registers and
          probes a cluster in connect mode; later phases add blueprint dispatch. The hub reads spoke
          state on demand and the spoke never pushes status back.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SpokeClusterSpec defines the desired state of a SpokeCluster.
            properties:
              blueprintRef:
                description: BlueprintRef is a Phase 2 field. The Phase 1 webhook
                  rejects it in connect mode.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  revision:
                    description: Revision pins an immutable revision of the referenced
                      object.
                    type: string
                required:
                - name
                type: object
              credential:
                description: Credential describes how the hub authenticates to the
                  spoke.
                properties:
                  aws:
                    description: AWS is set when Type is "aws".
                    properties:
                      authMode:
                        description: AuthMode is the AWS workload-identity mode.
                        enum:
                        - podIdentity
                        - irsa
                        type: string
                      clusterName:
                        description: ClusterName is the EKS cluster name.
                        type: string
                      externalId:
                        description: ExternalID is an optional external id used when
                          assuming the role (confused-deputy mitigation).
                        type: string
                      region:
                        description: Region is the AWS region of the EKS cluster.
                        type: string
                      roleArn:
                        description: RoleARN is the per-cluster IAM role the controller
                          assumes to reach this spoke.
                        type: string
                    required:
                    - authMode
                    - clusterName
                    - region
                    - roleArn
                    type: object
                  kubeconfig:
                    description: Kubeconfig is set when Type is "kubeconfig".
                    properties:
                      secretRef:
                        description: SecretRef points at the Secret holding the kubeconfig.
                        properties:
                          key:
                            description: Key within the Secret. Defaults to "kubeconfig"
                              when empty.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace of the Secret. Defaults to the
                              SpokeCluster namespace when empty.
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  type:
                    description: Type selects the authentication method.
                    enum:
                    - kubeconfig
                    - aws
                    type: string
                required:
                - type
                type: object
              deletionPolicy:
                default: detach
                description: DeletionPolicy controls cleanup of the materialized connectivity
                  on delete.
                enum:
                - detach
                - orphan
                type: string
              mode:
                default: connect
                description: Mode is the lifecycle mode. Phase 1 accepts "connect"
                  only.
                enum:
                - connect
                - provision
                - adopt
                type: string
              probeIntervalSeconds:
                default: 30
                description: ProbeIntervalSeconds is how often the hub probes the
                  spoke.
                format: int32
                maximum: 600
                minimum: 10
                type: integer
              probeTimeoutSeconds:
                default: 10
                description: ProbeTimeoutSeconds is the per-probe timeout.
                format: int32
                maximum: 120
                minimum: 1
                type: integer
              rolloutStrategyRef:
                description: RolloutStrategyRef is a Phase 2 field. The Phase 1 webhook
                  rejects it in connect mode.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  revision:
                    description: Revision pins an immutable revision of the referenced
                      object.
                    type: string
                required:
                - name
                type: object
            required:
            - credential
            type: object
          status:
            description: |-
              SpokeClusterStatus is the observed state of a SpokeCluster. It is written only by the hub
              controller; the spoke never pushes status back.
            properties:
              clusterInfo:
                description: ClusterInfo is the discovered inventory pulled from the
                  spoke.
                properties:
                  apiServerEndpoint:
                    description: APIServerEndpoint is the spoke API server URL.
                    type: string
                  kubernetesVersion:
                    description: KubernetesVersion is the reported server version.
                    type: string
                  latencyMillis:
                    description: LatencyMillis is the round-trip latency observed
                      by the last probe.
                    format: int64
                    type: integer
                  nodeCount:
                    description: NodeCount is the total number of nodes.
                    type: integer
                  platform:
                    description: Platform is inferred from node labels (eks, gke,
                      aks, kind, k3s, and so on).
                    type: string
                  region:
                    description: Region is the cloud region, when discoverable.
                    type: string
                  totalCPU:
                    description: TotalCPU is the aggregate node CPU capacity as a
                      resource quantity string.
                    type: string
                  totalMemory:
                    description: TotalMemory is the aggregate node memory capacity
                      as a resource quantity string.
                    type: string
                type: object
              conditions:
                description: Conditions carry the Registered, CredentialValid, Connected,
                  and InfoSynced conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connection:
                description: Connection is the connectivity observed by the last probe.
                enum:
                - Connected
                - Disconnected
                - Unknown
                type: string
              lastProbeTime:
                description: LastProbeTime is when the spoke was last probed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation most recently reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
