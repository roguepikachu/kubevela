---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: spokeclusters.core.oam.dev
spec:
  group: core.oam.dev
  names:
    categories:
    - oam
    kind: SpokeCluster
    listKind: SpokeClusterList
    plural: spokeclusters
    shortNames:
    - spc
    singular: spokecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: MODE
      type: string
    - jsonPath: .status.clusterInfo.kubernetesVersion
      name: VERSION
      type: string
    - jsonPath: .status.clusterInfo.nodeCount
      name: NODES
      type: integer
    - jsonPath: .status.clusterInfo.platform
      name: PLATFORM
      type: string
    - jsonPath: .status.connection
      name: STATUS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - jsonPath: .status.clusterInfo.region
      name: REGION
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.apiServerEndpoint
      name: ENDPOINT
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.totalCPU
      name: CPU
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.totalMemory
      name: MEMORY
      priority: 1
      type: string
    - jsonPath: .status.clusterInfo.latencyMillis
      name: LATENCY
      priority: 1
      type: integer
    - jsonPath: .status.authMethod
      name: AUTH
      priority: 1
      type: string
    - jsonPath: .status.lastProbeTime
      name: LAST PROBE
      priority: 1
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          SpokeCluster is the first-class hub representation of one managed cluster. A
          cluster acting as a hub for downstream clusters can hold SpokeCluster
          objects at any level of the tree.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SpokeClusterSpec is the desired state of a managed cluster
              on the hub.
            properties:
              blueprintRef:
                description: BlueprintRef references the ClusterBlueprint to apply
                  to the cluster.
                properties:
                  name:
                    description: Name is the ClusterBlueprint name.
                    type: string
                  revision:
                    description: Revision pins a specific blueprint revision.
                    type: string
                required:
                - name
                type: object
              credential:
                description: |-
                  Credential is the hub-to-spoke connectivity credential, a discriminated
                  union keyed by type.
                properties:
                  aws:
                    description: AWS holds AWS cloud-native identity configuration.
                    properties:
                      authMode:
                        description: AuthMode is the AWS authentication mode.
                        enum:
                        - podIdentity
                        - irsa
                        type: string
                      clusterName:
                        description: ClusterName is the EKS cluster name.
                        type: string
                      externalId:
                        description: ExternalID is an optional STS external id for
                          the role assumption.
                        type: string
                      region:
                        description: Region is the AWS region the cluster runs in.
                        type: string
                      roleArn:
                        description: RoleARN is the per-cluster IAM role the hub assumes.
                        type: string
                    required:
                    - authMode
                    - clusterName
                    - region
                    - roleArn
                    type: object
                  azure:
                    description: Azure holds Azure cloud-native identity configuration.
                    type: object
                  gcp:
                    description: GCP holds GCP cloud-native identity configuration.
                    type: object
                  kubeconfig:
                    description: Kubeconfig holds a reference to a kubeconfig Secret.
                    properties:
                      secretRef:
                        description: SecretRef points at the Secret holding the kubeconfig.
                        properties:
                          key:
                            description: Key is the data key within the Secret. Defaults
                              to "kubeconfig".
                            type: string
                          name:
                            description: Name is the Secret name.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Secret namespace. Cross-namespace references are
                              rejected by the webhook's default policy.
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  type:
                    description: Type selects the credential arm.
                    enum:
                    - kubeconfig
                    - aws
                    - azure
                    - gcp
                    type: string
                required:
                - type
                type: object
              mode:
                description: Mode is the cluster lifecycle mode.
                enum:
                - connect
                - provision
                - adopt
                type: string
              rolloutStrategyRef:
                description: |-
                  RolloutStrategyRef references the ClusterRolloutStrategy that gates
                  blueprint changes for the cluster.
                properties:
                  name:
                    description: Name is the ClusterRolloutStrategy name.
                    type: string
                required:
                - name
                type: object
            required:
            - credential
            - mode
            type: object
          status:
            description: SpokeClusterStatus is the observed state of a managed cluster.
            properties:
              authMethod:
                description: AuthMethod is the effective auth method used to connect.
                type: string
              clusterInfo:
                description: ClusterInfo is the discovered inventory of the spoke.
                properties:
                  apiServerEndpoint:
                    description: APIServerEndpoint is the spoke API server endpoint.
                    type: string
                  kubernetesVersion:
                    description: KubernetesVersion is the spoke API server version.
                    type: string
                  latencyMillis:
                    description: LatencyMillis is the last observed hub-to-spoke round-trip
                      latency.
                    format: int32
                    type: integer
                  nodeCount:
                    description: NodeCount is the number of nodes in the spoke.
                    format: int32
                    type: integer
                  platform:
                    description: Platform is the discovered cluster flavour (eks,
                      gke, aks, kind, k3s).
                    type: string
                  region:
                    description: Region is the cloud region the spoke runs in.
                    type: string
                  totalCPU:
                    description: TotalCPU is the aggregate allocatable CPU across
                      nodes.
                    type: string
                  totalMemory:
                    description: TotalMemory is the aggregate allocatable memory across
                      nodes.
                    type: string
                required:
                - kubernetesVersion
                - nodeCount
                - platform
                - region
                type: object
              conditions:
                description: Conditions is the list of standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connection:
                description: Connection is the observed connectivity state.
                enum:
                - Connected
                - Disconnected
                - Unknown
                type: string
              dispatchedRevision:
                description: DispatchedRevision records the blueprint revision applied
                  to the spoke.
                type: string
              lastProbeTime:
                description: LastProbeTime is when the hub last probed the spoke.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
