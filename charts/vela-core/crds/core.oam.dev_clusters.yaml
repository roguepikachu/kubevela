---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: clusters.core.oam.dev
spec:
  group: core.oam.dev
  names:
    categories:
    - oam
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    shortNames:
    - vcl
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .status.health.planesHealthy
      name: HEALTHY
      type: integer
    - jsonPath: .status.health.planesTotal
      name: PLANES
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Cluster is the spoke-side description of the cluster it lives on. The hub
          dispatches it as part of the bundle, together with the ClusterBlueprintRevision
          and ClusterPlaneRevision objects its phase refs name, and the spoke's
          vela-cluster-core renders each stage's planes into Applications in order. The
          hub pulls status on demand while the spoke is connected and never receives a
          push.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterSpec is one blueprint revision per lifecycle stage. Stages run in
              order clusterInit, planeProvisioning, healthValidation; a stage with no ref
              is skipped, but at least one has to be set.
            properties:
              clusterInit:
                description: |-
                  ClusterInit is the stage that prepares the cluster before any plane is
                  provisioned (for example CNI or cluster-wide policy).
                properties:
                  blueprintRef:
                    description: |-
                      BlueprintRef names the ClusterBlueprintRevision, in the Cluster's
                      namespace, whose planes this stage renders. Revisions are immutable, so
                      the name alone pins the content and revision is unused here.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      revision:
                        description: Revision pins an immutable revision of the referenced
                          object.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - blueprintRef
                type: object
              healthValidation:
                description: |-
                  HealthValidation is the stage that checks the provisioned cluster, run
                  after every plane is healthy.
                properties:
                  blueprintRef:
                    description: |-
                      BlueprintRef names the ClusterBlueprintRevision, in the Cluster's
                      namespace, whose planes this stage renders. Revisions are immutable, so
                      the name alone pins the content and revision is unused here.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      revision:
                        description: Revision pins an immutable revision of the referenced
                          object.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - blueprintRef
                type: object
              planeProvisioning:
                description: PlaneProvisioning is the stage that provisions the infrastructure
                  planes.
                properties:
                  blueprintRef:
                    description: |-
                      BlueprintRef names the ClusterBlueprintRevision, in the Cluster's
                      namespace, whose planes this stage renders. Revisions are immutable, so
                      the name alone pins the content and revision is unused here.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      revision:
                        description: Revision pins an immutable revision of the referenced
                          object.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - blueprintRef
                type: object
            type: object
            x-kubernetes-validations:
            - message: at least one of clusterInit, planeProvisioning or healthValidation
                must be set
              rule: has(self.clusterInit) || has(self.planeProvisioning) || has(self.healthValidation)
          status:
            description: |-
              ClusterStatus is the observed state of the spoke Cluster. The hub reads it
              on demand over the gateway and projects it into SpokeCluster.status.health;
              nothing here is ever pushed to the hub.
            properties:
              conditions:
                description: Conditions is the list of standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              health:
                description: Health is the aggregate of Planes.
                properties:
                  lastCheckTime:
                    description: LastCheckTime is when the spoke last aggregated plane
                      health.
                    format: date-time
                    type: string
                  planesHealthy:
                    description: PlanesHealthy is the number of planes reporting healthy.
                    type: integer
                  planesTotal:
                    description: PlanesTotal is the number of planes across every
                      stage.
                    type: integer
                  status:
                    description: Status is the aggregate health (Healthy or Degraded).
                    type: string
                required:
                - planesHealthy
                - planesTotal
                - status
                type: object
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the spoke controller.
                format: int64
                type: integer
              phase:
                description: Phase is where the Cluster is in its lifecycle.
                enum:
                - Pending
                - Initializing
                - Provisioning
                - Validating
                - Ready
                - Degraded
                type: string
              planes:
                description: Planes is the per-plane state across every stage, in
                  render order.
                items:
                  description: PlaneStatus is the observed state of one plane the
                    spoke rendered.
                  properties:
                    application:
                      description: Application is the Application the spoke rendered
                        the plane into.
                      type: string
                    healthy:
                      description: Healthy is true when every component of that Application
                        reports healthy.
                      type: boolean
                    message:
                      description: Message summarizes the component health messages.
                      type: string
                    name:
                      description: Name is the plane's name within its blueprint.
                      type: string
                    phase:
                      description: Phase is the lifecycle stage the plane ran in.
                      enum:
                      - clusterInit
                      - planeProvisioning
                      - healthValidation
                      type: string
                  required:
                  - application
                  - healthy
                  - name
                  - phase
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
