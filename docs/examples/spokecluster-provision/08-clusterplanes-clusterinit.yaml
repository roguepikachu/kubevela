# Two clusterInit planes for the spoke, rendered by the spoke's own vela-core from the Cluster CR the hub dispatches.
# Both are helm-flux components against plain HTTPS Helm repositories; the spoke needs no registry credentials for them.
# Same-phase planes without dependsOn install in parallel; waits are only added across phases or where dependsOn says so.
apiVersion: core.oam.dev/v1beta1
kind: ClusterPlane
metadata:
  name: foundation-policy
  namespace: vela-system
spec:
  description: Kyverno and a baseline Audit policy on the spoke
  components:
  - name: kyverno
    type: helm-flux
    properties:
      url: https://kyverno.github.io/kyverno/
      repoType: helm
      chart: kyverno
      version: "3.9.1"
      releaseName: kyverno
      targetNamespace: kyverno
      installTimeout: 10m
      values:
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
  - name: baseline-policies
    type: k8s-objects
    dependsOn: [kyverno]
    properties:
      objects:
      - apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: require-app-label
        spec:
          background: true
          rules:
          - name: require-app-kubernetes-io-name
            match:
              any:
              - resources:
                  kinds: [Deployment]
            exclude:
              any:
              - resources:
                  namespaces: [kube-system, vela-system, flux-system, kyverno, cert-manager]
            validate:
              failureAction: Audit
              message: Deployments must carry app.kubernetes.io/name
              pattern:
                metadata:
                  labels:
                    app.kubernetes.io/name: "?*"
---
apiVersion: core.oam.dev/v1beta1
kind: ClusterPlane
metadata:
  name: foundation-certs
  namespace: vela-system
spec:
  description: cert-manager on the spoke
  components:
  - name: cert-manager
    type: helm-flux
    properties:
      url: https://charts.jetstack.io
      repoType: helm
      chart: cert-manager
      version: v1.21.2
      releaseName: cert-manager
      targetNamespace: cert-manager
      installTimeout: 10m
      values:
        crds:
          enabled: true
---
