# SpokeCluster connecting to a k3d, k3s, or kind cluster via a static
# kubeconfig held in a Secret.
#
# Shape reference, not applyable as-is: the certificate fields below are truncated
# placeholders, so applying this verbatim registers the SpokeCluster and then fails
# materialization with "failed to parse kubeconfig: illegal base64 data". Substitute a
# real kubeconfig, for example `k3d kubeconfig write <cluster>`.
apiVersion: v1
kind: Secret
metadata:
  name: dev-spoke-kubeconfig
  namespace: vela-system
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: dev-spoke
        cluster:
          # Point at the server node itself, not the k3d load balancer. The
          # serverlb address is absent from the k3s API server certificate SAN,
          # so a kubeconfig naming it registers and then fails every handshake.
          #   docker inspect k3d-dev-spoke-server-0 \
          #     -f '{{.NetworkSettings.Networks.k3d-dev-spoke.IPAddress}}'
          server: https://172.20.0.2:6443
          certificate-authority-data: LS0tLS1CRUdJTi...
    users:
      - name: dev-spoke
        user:
          client-certificate-data: LS0tLS1CRUdJTi...
          client-key-data: LS0tLS1CRUdJTi...
    contexts:
      - name: dev-spoke
        context: { cluster: dev-spoke, user: dev-spoke }
    current-context: dev-spoke
---
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: dev-spoke
  namespace: vela-system
spec:
  mode: connect
  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        name: dev-spoke-kubeconfig
        # namespace: vela-system   # optional, defaults to the SpokeCluster's own
        #                          # namespace. Cross-namespace refs are resolved,
        #                          # not rejected, despite what some docs claim.
        # key: kubeconfig          # optional, defaults to "kubeconfig"
