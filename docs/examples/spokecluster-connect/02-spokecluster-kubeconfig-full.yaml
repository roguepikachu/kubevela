# Every field the connect path understands, set explicitly rather than defaulted.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: spoke-full
  namespace: vela-system
  labels:
    # Free-form. Nothing in the controller reads these; they are for your own selectors.
    provider: k3d
    environment: dev
spec:
  # Only "connect" is supported in this release. provision and adopt are rejected.
  mode: connect

  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        name: spoke-kubeconfig
        # Defaults to the SpokeCluster's namespace when omitted. An explicit value
        # must equal the SpokeCluster's own namespace; cross-namespace refs are
        # rejected by the admission webhook (and again by the provider).
        namespace: vela-system
        # Defaults to "kubeconfig".
        key: kubeconfig

  # How often the hub probes /healthz through cluster-gateway.
  # The actual requeue is the sooner of this and the credential's own refresh
  # deadline, so an AWS spoke is reconciled before its token expires.
  probeIntervalSeconds: 30

  # Per-probe timeout. Keep it well under probeIntervalSeconds.
  probeTimeoutSeconds: 10

  # detach removes the gateway Secret when this object is deleted.
  # orphan leaves it in place.
  deletionPolicy: detach
