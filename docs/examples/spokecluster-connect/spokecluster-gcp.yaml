# SpokeCluster connecting to a GKE cluster via GCP cloud-native identity.
#
# DO NOT APPLY. The gcp arm stays on the CRD so the schema is
# forward-compatible. The Phase 1 admission webhook rejects type gcp
# (unsupported credential type). This file documents the shape a future GKE
# provider will consume. See 08-invalid-examples.yaml for the rejection fixture.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: prod-us-central1
  namespace: vela-system
  labels:
    provider: gcp
    region: us-central1
spec:
  mode: connect
  credential:
    type: gcp
    gcp:
      authMode: workloadIdentityFederation   # workloadIdentityFederation | serviceAccount
      projectID: my-gcp-project
      location: us-central1
      clusterName: prod-us-central1
      # serviceAccountEmail: <optional>
