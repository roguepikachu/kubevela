# SpokeCluster connecting to an AKS cluster via Azure cloud-native identity.
#
# DO NOT APPLY. The azure arm stays on the CRD so the schema is
# forward-compatible. The Phase 1 admission webhook rejects type azure
# (unsupported credential type). This file documents the shape a future AKS
# provider will consume. See 08-invalid-examples.yaml for the rejection fixture.
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: prod-westeurope
  namespace: vela-system
  labels:
    provider: azure
    region: westeurope
spec:
  mode: connect
  credential:
    type: azure
    azure:
      authMode: workloadIdentity   # workloadIdentity | managedIdentity
      subscriptionID: 00000000-0000-0000-0000-000000000000
      resourceGroup: prod-rg
      clusterName: prod-westeurope
      # tenantID: <optional>
      # clientID: <optional>
