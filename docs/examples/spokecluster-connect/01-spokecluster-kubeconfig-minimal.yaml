# Smallest valid SpokeCluster. Everything else is defaulted:
#   mode                 -> connect
#   secretRef.namespace  -> the SpokeCluster's own namespace (team-a)
#   secretRef.key        -> kubeconfig
#   deletionPolicy       -> detach
#   probeIntervalSeconds / probeTimeoutSeconds -> schema defaults
apiVersion: core.oam.dev/v1beta1
kind: SpokeCluster
metadata:
  name: spoke-minimal
  namespace: team-a
spec:
  credential:
    type: kubeconfig
    kubeconfig:
      secretRef:
        name: spoke-kubeconfig
