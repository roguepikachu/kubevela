# The INPUT Secret. You create this by hand. It holds a kubeconfig for the spoke.
#
# Only needed for credential.type: kubeconfig. The aws arm needs no Secret.
#
# Default lookup: same namespace as the SpokeCluster, data key "kubeconfig".
# Both are overridable via credential.kubeconfig.secretRef.{namespace,key}.
#
# Easiest way to produce the payload from a real cluster:
#   kubectl create secret generic spoke-kubeconfig \
#     --from-file=kubeconfig=/path/to/spoke.kubeconfig -n team-a
#
# The literal below is spelled out so the required shape is visible.
apiVersion: v1
kind: Secret
metadata:
  name: spoke-kubeconfig
  namespace: team-a
type: Opaque
stringData:
  # Key must match credential.kubeconfig.secretRef.key, which defaults to "kubeconfig".
  kubeconfig: |
    apiVersion: v1
    kind: Config
    # current-context is what the provider reads. It must exist.
    current-context: spoke
    clusters:
      - name: spoke
        cluster:
          server: https://spoke.example.com:6443
          # MUST be inline. A file-path `certificate-authority:` is rejected.
          certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLnJlcGxhY2UgbWUuLi4KLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
          # Optional. If set it must equal the endpoint host ("spoke.example.com"),
          # otherwise registration is refused rather than silently dropped.
          # tls-server-name: spoke.example.com
    users:
      - name: spoke-sa
        user:
          # Either an embedded token (this) or embedded client-certificate-data +
          # client-key-data. Exec plugins and file paths are rejected.
          token: REPLACE_WITH_SERVICE_ACCOUNT_TOKEN
    contexts:
      - name: spoke
        context:
          cluster: spoke
          user: spoke-sa
---
# Client-certificate variant of the same input Secret.
apiVersion: v1
kind: Secret
metadata:
  name: spoke-kubeconfig-mtls
  namespace: team-a
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    current-context: spoke
    clusters:
      - name: spoke
        cluster:
          server: https://spoke.example.com:6443
          certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLnJlcGxhY2UgbWUuLi4KLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
    users:
      - name: spoke-admin
        user:
          client-certificate-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLnJlcGxhY2UgbWUuLi4KLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
          client-key-data: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQouLi5yZXBsYWNlIG1lLi4uCi0tLS0tRU5EIFJTQSBQUklWQVRFIEtFWS0tLS0tCg==
    contexts:
      - name: spoke
        context:
          cluster: spoke
          user: spoke-admin
